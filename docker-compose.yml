services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: petcare-postgres
    environment:
      POSTGRES_DB: petcare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: petcare-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: petcare-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    container_name: petcare-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/pet-care-public &&
      mc mb --ignore-existing local/pet-care-private &&
      mc anonymous set download local/pet-care-public &&
      echo 'MinIO buckets ready: pet-care-public (anonymous read), pet-care-private (private)';
      "
    restart: "no"

volumes:
  postgres_data:
